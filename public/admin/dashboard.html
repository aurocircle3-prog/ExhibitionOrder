<title>Dashboard — Expo Orders</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.svg">
<div id="nav"></div>
<div class="wrap">
  <div class="card" id="noExhibitionsCard" style="display:none">
    <h3 style="margin-top:0">No exhibitions yet</h3>
    <p class="muted">Create your first exhibition to start taking orders — or ExpoOrders can add you to one directly, if you'd rather.</p>
    <button class="primary" onclick="showCreateExhibition()">Create your first exhibition</button>
  </div>

  <div class="card" id="onboardingCard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">Getting started</h3>
      <button class="ghost small" onclick="dismissOnboarding()">Hide this</button>
    </div>
    <div id="onboardingSteps"></div>
  </div>

  <div class="lightbox" id="createExhibitionModal">
    <div class="crop-box" style="max-width:420px;text-align:left">
      <h3 style="margin-top:0">Create exhibition</h3>
      <div class="error" id="createExErr" style="display:none"></div>
      <label>Name</label>
      <input id="createExName" placeholder="e.g. Delhi Winter Expo 2026">
      <label>Location <span class="muted">(optional)</span></label>
      <input id="createExLocation">
      <div class="grid cols-2">
        <div><label>Start date <span class="muted">(optional)</span></label><input id="createExStart" type="date"></div>
        <div><label>End date <span class="muted">(optional)</span></label><input id="createExEnd" type="date"></div>
      </div>
      <div class="btn-row" style="margin-top:14px">
        <button class="primary" onclick="EXO.busy(this, submitCreateExhibition)">Create</button>
        <button class="ghost" onclick="document.getElementById('createExhibitionModal').classList.remove('open')">Cancel</button>
      </div>
    </div>
  </div>

  <div class="tabs" id="dashTabs" style="display:none">
    <button class="tab-btn" data-dashtab="overview" onclick="switchDashTab('overview')">Overview</button>
    <button class="tab-btn" data-dashtab="completed" onclick="switchDashTab('completed')">Completed</button>
  </div>

  <div class="tab-panel" id="dashtab-overview">
    <p class="muted" style="text-align:right;margin:0 0 6px;font-size:12px">Last updated: <span id="lastUpdated"></span> · <a href="#" onclick="load();return false;">Refresh</a></p>
    <div class="grid cols-4" id="statRow" style="margin-bottom:18px"></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>Current exhibitions</h3>
      <button class="ghost small" onclick="showCreateExhibition()">+ Create exhibition</button>
    </div>
    <div class="grid cols-2" id="currentExhibitions"></div>
  </div>

  <div class="tab-panel" id="dashtab-completed">
    <h3 style="margin-top:0">Completed exhibitions</h3>
    <div class="grid cols-2" id="completedExhibitions"></div>
  </div>
</div>

<script src="/app.js"></script>
<script>
const user = EXO.requireRole('admin');
document.getElementById('nav').innerHTML = EXO.adminNav('dashboard');
const tenantSlug = EXO.getTenantSlug();

function switchDashTab(name){
  document.querySelectorAll('#dashTabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.dashtab === name));
  document.querySelectorAll('.wrap > .tab-panel').forEach(p => p.classList.toggle('active', p.id === 'dashtab-' + name));
}

function fmtMetricValue(v){
  return typeof v === 'number' ? v.toLocaleString('en-IN') : (v ?? '');
}
function renderDashboardCard(card){
  const metrics = card.metrics || [];
  if (metrics.length <= 1) {
    const m = metrics[0] || { label: '', value: 0, unit: '' };
    return `<div class="card" style="text-align:center;padding:16px">
      <div class="muted" style="font-size:12px">${EXO.esc(card.label)}</div>
      <div style="font-size:28px;font-weight:800;margin-top:4px">${fmtMetricValue(m.value)}${m.unit ? ' ' + EXO.esc(m.unit) : ''}</div>
    </div>`;
  }
  // Multiple metrics on one card — each shown as its own labeled line
  // instead of picking just one number to feature, since the whole point
  // of combining them (e.g. Amount + Qty together) is seeing both at once.
  return `<div class="card" style="padding:16px">
    <div class="muted" style="font-size:12px;text-align:center;margin-bottom:6px">${EXO.esc(card.label)}</div>
    ${metrics.map(m => `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px">
        <span class="muted" style="font-size:12px">${EXO.esc(m.label)}</span>
        <span style="font-size:18px;font-weight:700">${fmtMetricValue(m.value)}${m.unit ? ' ' + EXO.esc(m.unit) : ''}</span>
      </div>`).join('')}
  </div>`;
}

function exhibitionCard(e){
  const dates = e.startDate ? `${e.startDate}${e.endDate ? ' – ' + e.endDate : ''}` : '';
  const validTillNote = e.validTill ? `<p class="muted" style="margin:2px 0">Valid till ${e.validTill}</p>` : '';
  const closedNote = e.closed ? `<p class="muted" style="margin:2px 0">Marked completed by your team</p>` : (e.status === 'completed' ? `<p class="muted" style="margin:2px 0">Access window ended</p>` : '');
  return `
    <div class="card">
      <h4 style="margin:0 0 4px">${EXO.esc(e.name)}</h4>
      <p class="muted" style="margin:2px 0">${EXO.esc(e.location) || ''}${e.location && dates ? ' · ' : ''}${dates}</p>
      ${validTillNote}${closedNote}
      <p class="muted" style="margin:8px 0">${e.itemCount} item${e.itemCount===1?'':'s'} · ${e.orderCount} order${e.orderCount===1?'':'s'}</p>
      <button class="primary" style="width:100%;padding:16px;font-size:16px;font-weight:700;margin-top:10px" onclick="enterExhibition('${e.id}','${EXO.escAttr(e.name)}')">${e.status === 'current' ? 'Enter →' : 'View →'}</button>
      ${e.status === 'current'
        ? `<p style="text-align:center;margin:8px 0 0"><a href="#" onclick="closeExhibition('${e.id}','${EXO.escAttr(e.name)}');return false;" class="muted" style="font-size:12px">Mark completed</a></p>`
        : (e.closed ? `<p style="text-align:center;margin:8px 0 0"><a href="#" onclick="reopenExhibition('${e.id}','${EXO.escAttr(e.name)}');return false;" class="muted" style="font-size:12px">Reopen</a></p>` : '')}
    </div>`;
}

async function load(){
  const [exhibitions, stats] = await Promise.all([
    EXO.apiFetch('/exhibitions'),
    EXO.apiFetch('/dashboard/stats'),
  ]);
  const current = exhibitions.filter(e => e.status === 'current');
  const completed = exhibitions.filter(e => e.status === 'completed');

  document.getElementById('noExhibitionsCard').style.display = exhibitions.length ? 'none' : 'block';
  document.getElementById('dashTabs').style.display = exhibitions.length ? 'flex' : 'none';
  if (exhibitions.length && !document.querySelector('#dashTabs .tab-btn.active')) switchDashTab('overview');

  // Shown right after the first exhibition exists, until the company has
  // both added an item and taken a real order — once both are true, this
  // has served its purpose and stays hidden for good, same as it never
  // shows at all if they already have real activity. Also stays hidden
  // once manually dismissed, regardless of completion state — someone
  // who's already familiar with the flow shouldn't have to finish every
  // step just to make it go away.
  const totalItems = exhibitions.reduce((sum, e) => sum + (e.itemCount || 0), 0);
  const totalOrders = exhibitions.reduce((sum, e) => sum + (e.orderCount || 0), 0);
  const onboardingCard = document.getElementById('onboardingCard');
  const dismissed = localStorage.getItem('exo_onboarding_dismissed_' + tenantSlug) === '1';
  if (!dismissed && exhibitions.length && (totalItems === 0 || totalOrders === 0)) {
    const firstEx = current[0] || exhibitions[0];
    onboardingCard.style.display = 'block';
    document.getElementById('onboardingSteps').innerHTML = renderOnboardingSteps(firstEx, totalItems, totalOrders);
  } else {
    onboardingCard.style.display = 'none';
  }

  document.getElementById('statRow').innerHTML = (stats.cards || []).map(renderDashboardCard).join('') || '<p class="muted">No dashboard cards set up yet — ask ExpoOrders to add some.</p>';
  document.getElementById('currentExhibitions').innerHTML = current.map(exhibitionCard).join('') || '<p class="muted">None right now.</p>';
  document.getElementById('completedExhibitions').innerHTML = completed.map(exhibitionCard).join('') || '<p class="muted">None yet.</p>';

  document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
}
function renderOnboardingSteps(ex, totalItems, totalOrders){
  const steps = [
    { done: true, label: 'Create your exhibition', action: null },
    { done: totalItems > 0, label: 'Add your first item', action: () => goToStep(ex, '/admin/item-master.html') },
    { done: totalOrders > 0, label: 'Take a test order', action: () => goToStep(ex, '/staff/order.html') },
    { done: totalOrders > 0, label: 'See it in Reports', action: () => goToStep(ex, '/admin/reports.html?exhibitionId=' + ex.id) },
  ];
  onboardingSteps = steps;
  return steps.map(s => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;${s.done ? 'opacity:0.55' : ''}">
      <span style="font-size:18px">${s.done ? '✅' : '⬜'}</span>
      <span style="flex:1">${EXO.esc(s.label)}</span>
      ${!s.done && s.action ? `<button class="ghost small" onclick="onboardingSteps[${steps.indexOf(s)}].action()">Go →</button>` : ''}
    </div>`).join('');
}
let onboardingSteps = [];
function dismissOnboarding(){
  localStorage.setItem('exo_onboarding_dismissed_' + tenantSlug, '1');
  document.getElementById('onboardingCard').style.display = 'none';
}
function goToStep(ex, path){
  localStorage.setItem('exo_current_exhibition_' + tenantSlug, ex.id);
  localStorage.setItem('exo_current_exhibition_name_' + tenantSlug, ex.name);
  location.href = path;
}
function enterExhibition(id, name){
  localStorage.setItem('exo_current_exhibition_' + tenantSlug, id);
  localStorage.setItem('exo_current_exhibition_name_' + tenantSlug, name);
  location.href = '/admin/exhibition-hub.html';
}
function showCreateExhibition(){
  document.getElementById('createExErr').style.display = 'none';
  document.getElementById('createExName').value = '';
  document.getElementById('createExLocation').value = '';
  document.getElementById('createExStart').value = '';
  document.getElementById('createExEnd').value = '';
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('createExStart').min = today;
  document.getElementById('createExEnd').min = today;
  document.getElementById('createExhibitionModal').classList.add('open');
}
async function submitCreateExhibition(){
  const err = document.getElementById('createExErr'); err.style.display = 'none';
  const name = document.getElementById('createExName').value.trim();
  if (!name) { err.textContent = 'Name is required'; err.style.display = 'block'; return; }
  const body = {
    name, location: document.getElementById('createExLocation').value.trim(),
    startDate: document.getElementById('createExStart').value, endDate: document.getElementById('createExEnd').value,
  };
  try {
    await EXO.apiFetch('/exhibitions', { method: 'POST', body: JSON.stringify(body) });
    document.getElementById('createExhibitionModal').classList.remove('open');
    EXO.toast('Exhibition created');
    load();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
}
async function closeExhibition(id, name){
  if (!confirm(`Mark "${name}" as completed? It'll move to Completed and won't be offered for new items or orders — you can reopen it any time.`)) return;
  try {
    await EXO.apiFetch('/exhibitions/' + id + '/close', { method: 'PUT' });
    EXO.toast(`"${name}" marked completed`);
    load();
  } catch (e) { EXO.toast(e.message, 'error'); }
}
async function reopenExhibition(id, name){
  try {
    await EXO.apiFetch('/exhibitions/' + id + '/reopen', { method: 'PUT' });
    EXO.toast(`"${name}" reopened`);
    load();
  } catch (e) { EXO.toast(e.message, 'error'); }
}
load();
</script>

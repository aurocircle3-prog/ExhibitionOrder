<title>Reports — Expo Orders</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.svg">
<div id="nav"></div>
<div id="subnav" class="wrap" style="padding-bottom:0"></div>
<div class="wrap">
  <div class="tabs" id="reportTabs"></div>
  <p class="muted" id="noCustomReportsMsg" style="display:none">No reports have been set up for your company yet — contact ExpoOrders to get one built.</p>
  <div id="reportPanels"></div>
</div>
<script src="/app.js"></script>
<script>
EXO.requireRole('admin');
document.getElementById('nav').innerHTML = EXO.adminNav('reports');
// Arriving with ?exhibitionId= (from the exhibition hub or its sub-nav)
// means every report on this page should default to that one exhibition
// instead of "All exhibitions" — and the sub-nav shows too, so this still
// feels like part of that same exhibition's set of screens.
const preselectExhibitionId = new URLSearchParams(location.search).get('exhibitionId') || '';
if (preselectExhibitionId) document.getElementById('subnav').innerHTML = EXO.exhibitionSubNav('reports');

let allExhibitions = [];
let reportList = [];
let activeReportId = null;

function switchReportTab(id){
  activeReportId = id;
  document.querySelectorAll('#reportTabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.reportId === id));
  document.querySelectorAll('.report-panel').forEach(p => p.classList.toggle('active', p.id === 'reportpanel-' + id));
  localStorage.setItem('exo_reports_tab', id);
  loadReportData(id);
}

async function init(){
  const [exhibitions, reports] = await Promise.all([
    EXO.apiFetch('/exhibitions'), EXO.apiFetch('/reports/custom'),
  ]);
  allExhibitions = exhibitions;
  reportList = reports;

  document.getElementById('noCustomReportsMsg').style.display = reports.length ? 'none' : 'block';
  document.getElementById('reportTabs').innerHTML = reports.map(r => `<button class="tab-btn" data-report-id="${r.id}" onclick="switchReportTab('${r.id}')">${EXO.esc(r.name)}</button>`).join('');

  const exOptionsHtml = '<option value="">All exhibitions</option>' + exhibitions.map(e => `<option value="${e.id}" ${e.id===preselectExhibitionId?'selected':''}>${EXO.esc(e.name)}${e.status==='completed'?' (completed)':''}</option>`).join('');
  document.getElementById('reportPanels').innerHTML = reports.map(r => `
    <div class="tab-panel report-panel" id="reportpanel-${r.id}">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px">
          <h3 style="margin:0">${EXO.esc(r.name)}</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <select id="exFilter-${r.id}" onchange="loadReportData('${r.id}')" style="max-width:200px">${exOptionsHtml}</select>
            <input id="search-${r.id}" placeholder="Search…" oninput="renderReportTable('${r.id}')" style="max-width:200px">
            <button class="ghost small" onclick="downloadReportExcel('${r.id}')">⬇ Excel</button>
          </div>
        </div>
        <div class="table-scroll"><table id="table-${r.id}">
          <thead><tr id="thead-${r.id}"></tr></thead>
          <tbody id="tbody-${r.id}"><tr><td class="muted">Loading…</td></tr></tbody>
          <tfoot id="tfoot-${r.id}"></tfoot>
        </table></div>
      </div>
    </div>`).join('');

  if (reports.length) switchReportTab(localStorage.getItem('exo_reports_tab') && reports.some(r => r.id === localStorage.getItem('exo_reports_tab')) ? localStorage.getItem('exo_reports_tab') : reports[0].id);
}

const reportDataCache = {};
async function loadReportData(id){
  const exId = document.getElementById('exFilter-' + id).value;
  document.getElementById('tbody-' + id).innerHTML = `<tr><td class="muted">Loading…</td></tr>`;
  try {
    reportDataCache[id] = await EXO.apiFetch(`/reports/custom/${id}` + (exId ? `?exhibitionId=${exId}` : ''));
  } catch (e) {
    reportDataCache[id] = null;
    document.getElementById('tbody-' + id).innerHTML = `<tr><td><div class="error" style="display:block">${EXO.esc(e.message)}</div></td></tr>`;
    return;
  }
  renderReportTable(id);
}
function fmtVal(v, c){
  if (typeof v === 'number') return c.decimals != null ? v.toFixed(c.decimals) + (c.unit ? ' ' + c.unit : '') : String(v);
  return v ?? '';
}
function renderReportTable(id){
  const data = reportDataCache[id];
  if (!data) return;
  const q = (document.getElementById('search-' + id).value || '').trim().toLowerCase();
  document.getElementById('thead-' + id).innerHTML = data.columns.map(c => `<th>${EXO.esc(c.label)}</th>`).join('');
  const rows = q ? data.rows.filter(row => data.columns.some(c => String(fmtVal(row[c.id], c)).toLowerCase().includes(q))) : data.rows;
  document.getElementById('tbody-' + id).innerHTML = rows.map(row => `<tr>${data.columns.map(c => `<td>${EXO.esc(fmtVal(row[c.id], c))}</td>`).join('')}</tr>`).join('')
    || `<tr><td colspan="${data.columns.length}" class="muted">No data for this exhibition yet</td></tr>`;
  // Grand-total footer row — only columns with showTotal actually get a
  // number; everything else in that row stays blank, same idea as the
  // totals row at the bottom of a printed order/ledger.
  const hasTotals = data.totals && Object.keys(data.totals).length;
  document.getElementById('tfoot-' + id).innerHTML = hasTotals
    ? `<tr style="font-weight:700;border-top:2px solid var(--line)">${data.columns.map((c, i) => `<td>${i === 0 ? 'Total' : (c.id in data.totals ? EXO.esc(fmtVal(data.totals[c.id], c)) : '')}</td>`).join('')}</tr>`
    : '';
}
function downloadReportExcel(id){
  const exId = document.getElementById('exFilter-' + id).value;
  const p = new URLSearchParams({ token: localStorage.getItem('exo_token'), tenant: EXO.getTenantSlug() });
  if (exId) p.set('exhibitionId', exId);
  location.href = `/api/reports/custom/${id}/export?${p.toString()}`;
}

init();
</script>

<title>Reports — Expo Orders</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.svg">
<div id="nav"></div>
<div class="wrap">
  <div class="tabs">
    <button class="tab-btn" data-tab="custom" onclick="switchTab('custom')">Custom Reports</button>
    <button class="tab-btn" data-tab="party" onclick="switchTab('party')">Party-wise</button>
    <button class="tab-btn" data-tab="item" onclick="switchTab('item')">Item-wise</button>
    <button class="tab-btn" data-tab="staff" onclick="switchTab('staff')">Staff-wise</button>
  </div>

  <!-- Shared filter bar for the three built-in reports — one exhibition
       picker and one search box instead of three duplicated sets, since
       whichever built-in tab you're on wants the same two controls. -->
  <div id="builtinFilterBar" style="display:none;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px">
    <select id="builtinExhibitionFilter" onchange="onBuiltinExhibitionChange()" style="max-width:220px"></select>
    <input id="builtinSearch" placeholder="Search…" oninput="renderActiveBuiltinTable()" style="max-width:220px;flex:1;min-width:160px">
    <button class="ghost small" onclick="exportActiveBuiltinReport()">⬇ Excel</button>
  </div>

  <div class="tab-panel" id="tab-custom">
    <div class="card">
      <h3 style="margin-top:0">Custom Reports</h3>
      <div class="grid cols-2">
        <div><label>Exhibition</label><select id="reportExhibition" onchange="loadReportData()"></select></div>
        <div><label>Report</label><select id="reportPicker" onchange="loadReportData()"></select></div>
      </div>
      <p class="muted" id="noCustomReportsMsg" style="display:none">No custom reports have been set up for your company yet — contact ExpoOrders to get one built.</p>
      <div id="customReportResult" style="margin-top:14px"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-party">
    <div class="grid cols-2" id="partyStats" style="margin-bottom:14px"></div>
    <div class="card">
      <h3 style="margin-top:0">Party-wise orders</h3>
      <div class="table-scroll"><table>
        <thead><tr>
          <th class="sortable" onclick="sortBuiltin('party','partyName')">Buyer<span class="sort-arrow" id="arrow-party-partyName"></span></th>
          <th class="sortable" onclick="sortBuiltin('party','partyPhone')">Phone<span class="sort-arrow" id="arrow-party-partyPhone"></span></th>
          <th class="sortable" onclick="sortBuiltin('party','orderCount')">Orders<span class="sort-arrow" id="arrow-party-orderCount"></span></th>
        </tr></thead>
        <tbody id="partyRows"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
      </table></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-item">
    <div class="grid cols-2" id="itemStats" style="margin-bottom:14px"></div>
    <div class="card">
      <h3 style="margin-top:0">Item-wise orders</h3>
      <div class="table-scroll"><table>
        <thead><tr>
          <th class="sortable" onclick="sortBuiltin('item','label')">Item<span class="sort-arrow" id="arrow-item-label"></span></th>
          <th class="sortable" onclick="sortBuiltin('item','scannerCode')">Scan code<span class="sort-arrow" id="arrow-item-scannerCode"></span></th>
          <th class="sortable" onclick="sortBuiltin('item','qty')">Qty ordered<span class="sort-arrow" id="arrow-item-qty"></span></th>
        </tr></thead>
        <tbody id="itemRows"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
      </table></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-staff">
    <div class="grid cols-2" id="staffStats" style="margin-bottom:14px"></div>
    <div class="card">
      <h3 style="margin-top:0">Staff-wise orders</h3>
      <div class="table-scroll"><table>
        <thead><tr>
          <th class="sortable" onclick="sortBuiltin('staff','staffName')">Staff<span class="sort-arrow" id="arrow-staff-staffName"></span></th>
          <th class="sortable" onclick="sortBuiltin('staff','orderCount')">Orders<span class="sort-arrow" id="arrow-staff-orderCount"></span></th>
        </tr></thead>
        <tbody id="staffRows"><tr><td colspan="2" class="muted">Loading…</td></tr></tbody>
      </table></div>
    </div>
  </div>
</div>
<script src="/app.js"></script>
<script>
EXO.requireRole('admin');
document.getElementById('nav').innerHTML = EXO.adminNav('reports');

function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
  localStorage.setItem('exo_reports_tab', name);
  document.getElementById('builtinFilterBar').style.display = name === 'custom' ? 'none' : 'flex';
  if (['party','item','staff'].includes(name)) renderActiveBuiltinTable();
}
function statCard(label, value){
  return `<div class="card" style="text-align:center;padding:16px"><div class="muted" style="font-size:12px">${label}</div><div style="font-size:26px;font-weight:800;margin-top:4px">${value}</div></div>`;
}

// ── Built-in reports: shared exhibition filter + search + sort + export ──
let allExhibitions = [];
const builtin = {
  party: { data: [], sortKey: 'orderCount', sortDir: -1, matchFields: p => [p.partyName, p.partyPhone] },
  item:  { data: [], sortKey: 'qty', sortDir: -1, matchFields: i => [i.label, i.scannerCode] },
  staff: { data: [], sortKey: 'orderCount', sortDir: -1, matchFields: s => [s.staffName] },
};
function activeBuiltinTab(){
  return document.querySelector('.tab-btn.active')?.dataset.tab;
}
async function onBuiltinExhibitionChange(){
  await Promise.all([loadBuiltin('party'), loadBuiltin('item'), loadBuiltin('staff')]);
  renderActiveBuiltinTable();
}
async function loadBuiltin(type){
  const exId = document.getElementById('builtinExhibitionFilter').value;
  builtin[type].data = await EXO.apiFetch(`/reports/${type === 'party' ? 'party-wise' : type === 'item' ? 'item-wise' : 'staff-wise'}` + (exId ? '?exhibitionId=' + exId : ''));
}
function sortBuiltin(type, key){
  const b = builtin[type];
  b.sortDir = b.sortKey === key ? -b.sortDir : 1;
  b.sortKey = key;
  renderActiveBuiltinTable();
}
function renderActiveBuiltinTable(){
  const type = activeBuiltinTab();
  if (!['party','item','staff'].includes(type)) return;
  const b = builtin[type];
  const q = document.getElementById('builtinSearch').value.trim().toLowerCase();
  let rows = q ? b.data.filter(r => b.matchFields(r).some(f => (f || '').toLowerCase().includes(q))) : b.data.slice();
  rows.sort((a, c) => {
    const av = a[b.sortKey], cv = c[b.sortKey];
    const cmp = typeof av === 'number' ? av - cv : String(av || '').localeCompare(String(cv || ''));
    return cmp * b.sortDir;
  });
  document.querySelectorAll(`[id^="arrow-${type}-"]`).forEach(el => el.textContent = '');
  const arrowEl = document.getElementById(`arrow-${type}-${b.sortKey}`);
  if (arrowEl) arrowEl.textContent = b.sortDir === 1 ? '▲' : '▼';

  if (type === 'party') {
    document.getElementById('partyStats').innerHTML = statCard('Total buyers', b.data.length) + statCard('Total orders', b.data.reduce((s,p)=>s+p.orderCount,0));
    document.getElementById('partyRows').innerHTML = rows.map(p => `<tr><td>${EXO.esc(p.partyName)}</td><td>${EXO.esc(p.partyPhone)}</td><td>${p.orderCount}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No matches</td></tr>';
  } else if (type === 'item') {
    document.getElementById('itemStats').innerHTML = statCard('Unique items ordered', b.data.length) + statCard('Total quantity sold', b.data.reduce((s,i)=>s+i.qty,0));
    document.getElementById('itemRows').innerHTML = rows.map(i => `<tr><td>${EXO.esc(i.label)}</td><td>${EXO.esc(i.scannerCode||'')}</td><td>${i.qty}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No matches</td></tr>';
  } else {
    document.getElementById('staffStats').innerHTML = statCard('Staff who took orders', b.data.length) + statCard('Total orders', b.data.reduce((s,st)=>s+st.orderCount,0));
    document.getElementById('staffRows').innerHTML = rows.map(s => `<tr><td>${EXO.esc(s.staffName)}</td><td>${s.orderCount}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">No matches</td></tr>';
  }
}
function exportActiveBuiltinReport(){
  const type = activeBuiltinTab();
  const routeName = type === 'party' ? 'party-wise' : type === 'item' ? 'item-wise' : 'staff-wise';
  const exId = document.getElementById('builtinExhibitionFilter').value;
  const p = new URLSearchParams({ token: localStorage.getItem('exo_token'), tenant: EXO.getTenantSlug() });
  if (exId) p.set('exhibitionId', exId);
  location.href = `/api/reports/${routeName}/export?${p.toString()}`;
}

// ── Custom Reports (unchanged mechanics, kept as its own self-contained tab) ──
let customReportList = [];
async function loadCustomReportsTab(){
  const [exhibitions, reports] = await Promise.all([
    EXO.apiFetch('/exhibitions'), EXO.apiFetch('/reports/custom'),
  ]);
  allExhibitions = exhibitions;
  customReportList = reports;
  const exOptionsHtml = exhibitions.map(e => `<option value="${e.id}">${EXO.esc(e.name)}${e.status==='completed'?' (completed)':''}</option>`).join('') || '<option value="">— no exhibitions yet —</option>';
  document.getElementById('reportExhibition').innerHTML = exOptionsHtml;
  document.getElementById('builtinExhibitionFilter').innerHTML = `<option value="">All exhibitions</option>` + exOptionsHtml;
  const repSelect = document.getElementById('reportPicker');
  document.getElementById('noCustomReportsMsg').style.display = reports.length ? 'none' : 'block';
  repSelect.parentElement.style.display = reports.length ? 'block' : 'none';
  repSelect.innerHTML = reports.map(r => `<option value="${r.id}">${EXO.esc(r.name)}</option>`).join('');
  if (exhibitions.length && reports.length) loadReportData();
}
async function loadReportData(){
  const exId = document.getElementById('reportExhibition').value;
  const repId = document.getElementById('reportPicker').value;
  const box = document.getElementById('customReportResult');
  if (!exId || !repId) { box.innerHTML = ''; return; }
  box.innerHTML = '<p class="muted">Loading…</p>';
  try {
    const data = await EXO.apiFetch(`/reports/custom/${repId}?exhibitionId=${exId}`);
    const headers = data.columns.map(c => c.label);
    const fmtVal = (v, c) => {
      if (typeof v === 'number') return c.decimals != null ? v.toFixed(c.decimals) + (c.unit ? ' ' + c.unit : '') : String(v);
      return v ?? '';
    };
    box.innerHTML = `
      <div class="btn-row" style="justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px">
        <input id="customReportSearch" placeholder="Search…" oninput="filterCustomReportTable()" style="max-width:220px">
        <button class="ghost small" onclick="downloadReportExcel()">⬇ Download Excel</button>
      </div>
      <div class="table-scroll"><table>
        <thead><tr>${headers.map(h => `<th>${EXO.esc(h)}</th>`).join('')}</tr></thead>
        <tbody id="customReportRows">${data.rows.map(row => `<tr>${data.columns.map(c => `<td>${EXO.esc(fmtVal(row[c.id], c))}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${headers.length}" class="muted">No data for this exhibition yet</td></tr>`}</tbody>
      </table></div>`;
  } catch (e) { box.innerHTML = `<div class="error" style="display:block">${EXO.esc(e.message)}</div>`; }
}
function filterCustomReportTable(){
  const q = document.getElementById('customReportSearch').value.trim().toLowerCase();
  document.querySelectorAll('#customReportRows tr').forEach(tr => {
    tr.style.display = !q || tr.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}
function downloadReportExcel(){
  const exId = document.getElementById('reportExhibition').value;
  const repId = document.getElementById('reportPicker').value;
  const p = new URLSearchParams({ token: localStorage.getItem('exo_token'), tenant: EXO.getTenantSlug(), exhibitionId: exId });
  location.href = `/api/reports/custom/${repId}/export?${p.toString()}`;
}

(async function(){
  await loadCustomReportsTab();
  await Promise.all([loadBuiltin('party'), loadBuiltin('item'), loadBuiltin('staff')]);
  switchTab(localStorage.getItem('exo_reports_tab') || 'custom');
})();
</script>
